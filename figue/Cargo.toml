[package]
name = "figue"
version = "5.0.0-rc.5"
edition.workspace = true
rust-version.workspace = true
authors = ["Amos Wenger <amos@bearcove.eu>"]
license.workspace = true
repository.workspace = true
homepage = "https://facet.rs"
keywords = ["cli", "args", "parser", "facet", "command-line"]
categories = ["command-line-interface"]
description = "Type-safe CLI arguments, config files, and environment variables powered by Facet reflection"
documentation = "https://docs.rs/figue"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
camino.workspace = true
figue-attrs.workspace = true
facet = { workspace = true, features = ["camino", "indexmap"] }
facet-core.workspace = true
facet-format.workspace = true
facet-json.workspace = true
facet-reflect.workspace = true
facet-pretty.workspace = true
facet-error.workspace = true
heck.workspace = true
indexmap = { workspace = true, features = ["std"] }
owo-colors.workspace = true
tracing.workspace = true
ariadne.workspace = true
unicode-width.workspace = true
strip-ansi-escapes.workspace = true
strsim.workspace = true
supports-color.workspace = true
arbitrary = { version = "1.4.2", optional = true, features = ["derive"] }
rand = { version = "0.9.2", optional = true }
rand_chacha = { version = "0.9.0", optional = true }

[dev-dependencies]
facet-format = { workspace = true, features = ["tracing"] }
facet-default = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-json = { workspace = true, features = ["tracing"] }
facet-reflect = { workspace = true, features = ["tracing"] }
facet = { workspace = true, features = ["all-impls"] }
facet-solver.workspace = true
facet-testhelpers.workspace = true
insta.workspace = true
tempfile.workspace = true

[features]
default = ["rich-diagnostics"]
rich-diagnostics = []
doc = ["facet/doc"]
tracing = ["facet-reflect/tracing", "facet-json/tracing", "facet-format/tracing"]
arbitrary = ["dep:arbitrary", "dep:rand", "dep:rand_chacha"]

[lints]
workspace = true


